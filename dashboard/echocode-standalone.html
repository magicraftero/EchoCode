<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>EchoCode — AI Code Forensics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@500&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
/* ─── EchoCode Dashboard ───────────────────────────────────────────────
   Apple-style layout and type (big headlines, generous space, alternating
   black / light-grey / white sections) with Google's colour system, Material 3
   buttons and chips. Colour tokens are registered with @property so the whole
   page morphs smoothly between section themes as you scroll. */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── Animatable colour tokens ──────────────────────────────────────── */
@property --bg        { syntax: '<color>'; inherits: true; initial-value: #000; }
@property --fg        { syntax: '<color>'; inherits: true; initial-value: #f5f5f7; }
@property --fg2       { syntax: '<color>'; inherits: true; initial-value: #a1a1a6; }
@property --fg3       { syntax: '<color>'; inherits: true; initial-value: #6e6e73; }
@property --card      { syntax: '<color>'; inherits: true; initial-value: #161617; }
@property --card2     { syntax: '<color>'; inherits: true; initial-value: #1d1d1f; }
@property --hair      { syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,.1); }
@property --shadow    { syntax: '<color>'; inherits: true; initial-value: rgba(0,0,0,0); }
@property --glow      { syntax: '<color>'; inherits: true; initial-value: rgba(138,180,248,.9); }
@property --dock      { syntax: '<color>'; inherits: true; initial-value: rgba(44,44,48,.55); }
@property --dock-line { syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,.14); }
@property --dock-on   { syntax: '<color>'; inherits: true; initial-value: rgba(255,255,255,.14); }
@property --btn       { syntax: '<color>'; inherits: true; initial-value: #a8c7fa; }
@property --on-btn    { syntax: '<color>'; inherits: true; initial-value: #062e6f; }
@property --tonal     { syntax: '<color>'; inherits: true; initial-value: #0842a0; }
@property --on-tonal  { syntax: '<color>'; inherits: true; initial-value: #d3e3fd; }
@property --outline   { syntax: '<color>'; inherits: true; initial-value: #8e918f; }
@property --link      { syntax: '<color>'; inherits: true; initial-value: #a8c7fa; }
@property --chip-on   { syntax: '<color>'; inherits: true; initial-value: #004a77; }
@property --on-chip   { syntax: '<color>'; inherits: true; initial-value: #c2e7ff; }
@property --t-blue    { syntax: '<color>'; inherits: true; initial-value: #8ab4f8; }
@property --t-green   { syntax: '<color>'; inherits: true; initial-value: #81c995; }
@property --t-red     { syntax: '<color>'; inherits: true; initial-value: #f28b82; }
@property --t-yellow  { syntax: '<color>'; inherits: true; initial-value: #fdd663; }
@property --t-purple  { syntax: '<color>'; inherits: true; initial-value: #d7aefb; }
@property --t-gray    { syntax: '<color>'; inherits: true; initial-value: #9aa0a6; }
@property --b-blue    { syntax: '<color>'; inherits: true; initial-value: rgba(138,180,248,.16); }
@property --b-green   { syntax: '<color>'; inherits: true; initial-value: rgba(129,201,149,.16); }
@property --b-red     { syntax: '<color>'; inherits: true; initial-value: rgba(242,139,130,.16); }
@property --b-yellow  { syntax: '<color>'; inherits: true; initial-value: rgba(253,214,99,.16); }
@property --b-purple  { syntax: '<color>'; inherits: true; initial-value: rgba(215,174,251,.16); }
@property --b-gray    { syntax: '<color>'; inherits: true; initial-value: rgba(154,160,166,.16); }

:root {
  /* dark (default: the page opens on the hero) */
  --bg: #000; --fg: #f5f5f7; --fg2: #a1a1a6; --fg3: #6e6e73;
  --card: #161617; --card2: #1d1d1f; --hair: rgba(255,255,255,.1);
  --shadow: rgba(0,0,0,0); --glow: rgba(138,180,248,.9);
  --dock: rgba(44,44,48,.55); --dock-line: rgba(255,255,255,.14); --dock-on: rgba(255,255,255,.14);
  --btn: #a8c7fa; --on-btn: #062e6f; --tonal: #0842a0; --on-tonal: #d3e3fd;
  --outline: #8e918f; --link: #a8c7fa; --chip-on: #004a77; --on-chip: #c2e7ff;
  --t-blue: #8ab4f8; --t-green: #81c995; --t-red: #f28b82; --t-yellow: #fdd663; --t-purple: #d7aefb; --t-gray: #9aa0a6;
  --b-blue: rgba(138,180,248,.16); --b-green: rgba(129,201,149,.16); --b-red: rgba(242,139,130,.16);
  --b-yellow: rgba(253,214,99,.16); --b-purple: rgba(215,174,251,.16); --b-gray: rgba(154,160,166,.16);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --gfont: "Google Sans", "Google Sans Text", "Roboto", "Inter", system-ui, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, "Cascadia Code", monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --r-card: 28px;

  transition:
    --bg .8s var(--ease), --fg .8s var(--ease), --fg2 .8s var(--ease), --fg3 .8s var(--ease),
    --card .8s var(--ease), --card2 .8s var(--ease), --hair .8s var(--ease), --shadow .8s var(--ease),
    --glow .8s var(--ease), --dock .8s var(--ease), --dock-line .8s var(--ease), --dock-on .8s var(--ease),
    --btn .8s var(--ease), --on-btn .8s var(--ease), --tonal .8s var(--ease), --on-tonal .8s var(--ease),
    --outline .8s var(--ease), --link .8s var(--ease), --chip-on .8s var(--ease), --on-chip .8s var(--ease),
    --t-blue .8s var(--ease), --t-green .8s var(--ease), --t-red .8s var(--ease), --t-yellow .8s var(--ease),
    --t-purple .8s var(--ease), --t-gray .8s var(--ease), --b-blue .8s var(--ease), --b-green .8s var(--ease),
    --b-red .8s var(--ease), --b-yellow .8s var(--ease), --b-purple .8s var(--ease), --b-gray .8s var(--ease);
}

:root[data-theme="light"], :root[data-theme="paper"] {
  --bg: #f5f5f7; --fg: #1d1d1f; --fg2: #6e6e73; --fg3: #86868b;
  --card: #ffffff; --card2: #f5f5f7; --hair: rgba(0,0,0,.08);
  --shadow: rgba(0,0,0,.08); --glow: rgba(26,115,232,.75);
  --dock: rgba(255,255,255,.62); --dock-line: rgba(0,0,0,.08); --dock-on: rgba(0,0,0,.07);
  --btn: #0b57d0; --on-btn: #ffffff; --tonal: #d3e3fd; --on-tonal: #041e49;
  --outline: #747775; --link: #0b57d0; --chip-on: #c2e7ff; --on-chip: #001d35;
  --t-blue: #1a73e8; --t-green: #188038; --t-red: #d93025; --t-yellow: #b06000; --t-purple: #9334e6; --t-gray: #5f6368;
  --b-blue: #e8f0fe; --b-green: #e6f4ea; --b-red: #fce8e6; --b-yellow: #fef7e0; --b-purple: #f3e8fd; --b-gray: #f1f3f4;
}
:root[data-theme="paper"] { --bg: #ffffff; --card: #f5f5f7; --card2: #ffffff; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: #4285F4; color: #fff; }
.mono { font-family: var(--mono); font-size: .92em; letter-spacing: 0; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
b { font-weight: 600; }

/* tone helpers */
.t-blue { color: var(--t-blue); } .t-green { color: var(--t-green); } .t-red { color: var(--t-red); }
.t-yellow { color: var(--t-yellow); } .t-purple { color: var(--t-purple); } .t-gray { color: var(--t-gray); }
.tone-blue   { --tc: var(--t-blue);   --tb: var(--b-blue); }
.tone-green  { --tc: var(--t-green);  --tb: var(--b-green); }
.tone-red    { --tc: var(--t-red);    --tb: var(--b-red); }
.tone-yellow { --tc: var(--t-yellow); --tb: var(--b-yellow); }
.tone-purple { --tc: var(--t-purple); --tb: var(--b-purple); }
.tone-gray   { --tc: var(--t-gray);   --tb: var(--b-gray); }

.ic { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

/* ─── Logo mark (Google four-dot) ───────────────────────────────────── */
.logo-mark { display: inline-grid; grid-template-columns: repeat(2, 7px); gap: 3px; vertical-align: middle; }
.logo-mark i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.logo-mark i:nth-child(1) { background: #4285F4; }
.logo-mark i:nth-child(2) { background: #EA4335; }
.logo-mark i:nth-child(3) { background: #FBBC04; }
.logo-mark i:nth-child(4) { background: #34A853; }

/* ─── Boot / loading ────────────────────────────────────────────────── */
.boot {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: #000;
  color: #f5f5f7;
  text-align: center;
  padding: 24px;
}
.boot-logo { font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
.boot .logo-mark i { animation: bootDot 1.2s var(--ease) infinite; }
.boot .logo-mark i:nth-child(2) { animation-delay: .15s; }
.boot .logo-mark i:nth-child(3) { animation-delay: .45s; }
.boot .logo-mark i:nth-child(4) { animation-delay: .3s; }
@keyframes bootDot { 0%, 100% { transform: scale(1); } 50% { transform: scale(.4); opacity: .5; } }
.boot-text { color: #a1a1a6; font-size: 15px; }
.boot-error { color: #f28b82; font-weight: 600; }
.boot-help { color: #a1a1a6; font-size: 14px; max-width: 420px; }
.boot code { font-family: var(--mono); color: #f5f5f7; }

/* ─── Dock (floating translucent icon menu) ─────────────────────────── */
.dock {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border-radius: 999px;
  background: var(--dock);
  border: 1px solid var(--dock-line);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 10px 40px -12px rgba(0,0,0,.45);
  animation: dockIn .9s var(--spring) .2s both;
}
@keyframes dockIn { from { opacity: 0; transform: translate(-50%, -24px) scale(.9); } }
.dock-item {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  height: 40px;
  padding: 0 10px;
  border-radius: 999px;
  color: var(--fg2);
  text-decoration: none;
  font-family: var(--gfont);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: color .3s, background-color .3s, padding .45s var(--ease);
}
.dock-item .ic { transition: transform .45s var(--spring); }
.dock-label {
  display: inline-block;
  max-width: 0;
  opacity: 0;
  margin-left: 0;
  transition: max-width .5s var(--ease), opacity .3s, margin .5s var(--ease);
}
.dock-item:hover, .dock-item:focus-visible { color: var(--fg); background: var(--dock-on); padding: 0 16px 0 12px; }
.dock-item:hover .dock-label, .dock-item:focus-visible .dock-label { max-width: 140px; opacity: 1; margin-left: 8px; }
.dock-item:hover .ic { transform: scale(1.12); }
.dock-item.active { color: var(--fg); background: var(--dock-on); }
.dock-item.active::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: var(--link);
}
.dock-item:hover::after, .dock-item:focus-visible::after { opacity: 0; }
.dock-item:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

/* ─── Google Material 3 buttons ─────────────────────────────────────── */
.gbtn {
  --sl: currentColor;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 24px;
  border-radius: 20px;
  border: none;
  font-family: var(--gfont);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .1px;
  cursor: pointer;
  white-space: nowrap;
  transition: box-shadow .28s var(--ease), background-color .28s, color .28s, transform .2s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.gbtn .ic { width: 18px; height: 18px; }
.gbtn.has-icon { padding: 0 24px 0 16px; }
.gbtn::before {  /* state layer */
  content: '';
  position: absolute;
  inset: 0;
  background: var(--sl);
  opacity: 0;
  transition: opacity .2s;
  z-index: -1;
}
.gbtn:hover::before { opacity: .08; }
.gbtn:focus-visible::before, .gbtn:active::before { opacity: .12; }
.gbtn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.gbtn:active { transform: scale(.98); }
.gbtn-filled { background: var(--btn); color: var(--on-btn); }
.gbtn-filled:hover { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15); }
.gbtn-tonal { background: var(--tonal); color: var(--on-tonal); }
.gbtn-tonal:hover { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15); }
.gbtn-outlined { background: transparent; color: var(--link); box-shadow: inset 0 0 0 1px var(--outline); }
.gbtn-text { background: transparent; color: var(--link); padding: 0 12px; }
.gbtn-text.has-icon { padding: 0 16px 0 12px; }
.gbtn[aria-expanded="true"] .ic { transform: rotate(180deg); }
.gbtn .ic { transition: transform .35s var(--ease); }

.icon-btn {
  position: relative;
  overflow: hidden;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--outline);
  color: var(--fg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color .2s, opacity .2s, transform .2s var(--ease);
}
.icon-btn:hover { background: var(--dock-on); }
.icon-btn:active { transform: scale(.94); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

.ripple {
  position: absolute;
  border-radius: 50%;
  background: currentColor;
  opacity: .18;
  transform: scale(0);
  pointer-events: none;
  animation: ripple .6s var(--ease) forwards;
}
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* Material filter chips */
.fchips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 0;
  height: 32px;
  padding: 0 16px;
  border-radius: 8px;
  border: none;
  box-shadow: inset 0 0 0 1px var(--outline);
  background: transparent;
  color: var(--fg2);
  font-family: var(--gfont);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color .25s, color .25s, box-shadow .25s, padding .3s var(--ease);
}
.fchip .ic { width: 0; height: 18px; opacity: 0; transition: width .3s var(--ease), opacity .2s, margin .3s var(--ease); }
.fchip em { font-style: normal; margin-left: 8px; opacity: .6; }
.fchip:hover { background: var(--dock-on); }
.fchip.on { background: var(--chip-on); color: var(--on-chip); box-shadow: none; padding-left: 8px; }
.fchip.on .ic { width: 18px; opacity: 1; margin-right: 8px; }
.fchip:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--tb);
  color: var(--tc);
  font-family: var(--gfont);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .1px;
  white-space: nowrap;
  width: fit-content;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 4px transparent; opacity: .6; } }

/* ─── Hero (pinned; the sheet slides over it) ───────────────────────── */
.hero {
  --p: 0;
  --btn: #a8c7fa; --on-btn: #062e6f; --outline: #8e918f; --link: #a8c7fa;
  --t-green: #81c995; --b-green: rgba(129,201,149,.16);
  position: sticky;
  top: 0;
  height: 100vh;
  min-height: 640px;
  overflow: hidden;
  background: #000;
  color: #f5f5f7;
  z-index: 0;
}
.hero-stage {
  position: absolute;
  inset: 0;
  transform: translateY(calc(var(--p) * -60px)) scale(calc(1 + var(--p) * .08));
  opacity: calc(1 - var(--p) * .7);
  animation: globeRise 1.6s var(--ease) .1s both;
}
@keyframes globeRise { from { opacity: 0; transform: translateY(120px) scale(.94); } }
.hero-globe { width: 100%; height: 100%; display: block; }
.hero::after {  /* dims as the sheet covers it */
  content: '';
  position: absolute;
  inset: 0;
  background: #000;
  opacity: calc(var(--p) * .7);
  pointer-events: none;
}

.hero-inner {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: clamp(96px, 14vh, 150px) 24px 0;
  max-width: 980px;
  margin: 0 auto;
  transform: translateY(calc(var(--p) * -140px));
  opacity: calc(1 - var(--p) * 1.6);
}
.hero-kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 18px;
  animation: rise .9s var(--ease) both;
}
.hero-kicker .sep { width: 1px; height: 14px; background: rgba(255,255,255,.25); }
.hero-kicker .muted { color: #a1a1a6; font-weight: 500; }
.hero-title {
  font-size: clamp(42px, 6.4vw, 88px);
  font-weight: 700;
  letter-spacing: -.035em;
  line-height: 1.02;
  margin-bottom: 20px;
}
.hero-title .line { display: block; }
.hero-title .w {
  display: inline-block;
  animation: wordIn 1s var(--ease) both;
  animation-delay: calc(var(--i) * 90ms + 150ms);
}
.grad-line { animation: wordIn 1.1s var(--ease) .5s both; }
.grad {
  background: linear-gradient(90deg, #4285F4 0%, #A142F4 30%, #EA4335 60%, #FBBC04 85%, #4285F4 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradShift 8s linear infinite;
}
@keyframes gradShift { to { background-position: -200% 0; } }
@keyframes wordIn { from { opacity: 0; transform: translateY(.45em); filter: blur(12px); } }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } }
.hero-sub {
  font-size: clamp(17px, 1.6vw, 21px);
  color: #a1a1a6;
  max-width: 760px;
  margin: 0 auto 28px;
  animation: rise 1s var(--ease) .75s both;
}
.hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; animation: rise 1s var(--ease) .9s both; }
.hero-status {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  margin-top: 22px;
  font-size: 13px;
  color: #a1a1a6;
  animation: rise 1s var(--ease) 1.05s both;
}

.hero-floats { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: calc(1 - var(--p) * 1.4); }
.float-chip {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(28,28,30,.6);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: var(--mono);
  font-size: 12px;
  color: #d2d2d7;
  animation: floatY 7s ease-in-out infinite, rise 1.2s var(--ease) 1.2s both;
}
.float-chip i { width: 8px; height: 8px; border-radius: 50%; }
.dot-blue { background: #4285F4; } .dot-green { background: #34A853; } .dot-yellow { background: #FBBC04; } .dot-purple { background: #A142F4; }
.fc-1 { left: 7%;  top: 62%; animation-delay: 0s, 1.2s; }
.fc-2 { left: 14%; top: 80%; animation-delay: -2s, 1.35s; }
.fc-3 { right: 8%; top: 64%; animation-delay: -4s, 1.5s; }
.fc-4 { right: 13%; top: 82%; animation-delay: -1s, 1.65s; }
@keyframes floatY { 0%, 100% { translate: 0 0; } 50% { translate: 0 -14px; } }

.scroll-cue {
  position: absolute;
  bottom: 24px;
  left: 50%;
  z-index: 3;
  width: 44px;
  height: 44px;
  margin-left: -22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #f5f5f7;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(10px);
  opacity: calc(1 - var(--p) * 3);
  animation: bob 2.4s ease-in-out infinite;
  transition: background .2s;
}
.scroll-cue:hover { background: rgba(255,255,255,.16); }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 6px; } }

/* ─── Sheet: content slides over the pinned hero ────────────────────── */
.sheet {
  position: relative;
  z-index: 2;
  background: var(--bg);
  border-radius: 48px 48px 0 0;
  box-shadow: 0 -30px 80px rgba(0,0,0,.55);
}
.sec { position: relative; padding: clamp(96px, 13vh, 150px) 0; overflow-x: clip; overflow-y: visible; }
.wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 24px; }

.orb {
  position: absolute;
  z-index: 0;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  filter: blur(70px);
  opacity: .35;
  pointer-events: none;
  animation: orbFloat 14s ease-in-out infinite;
}
.orb-blue { background: #4285F4; } .orb-red { background: #EA4335; } .orb-yellow { background: #FBBC04; }
.orb-green { background: #34A853; } .orb-purple { background: #A142F4; }
:root[data-theme="light"] .orb, :root[data-theme="paper"] .orb { opacity: .16; }
@keyframes orbFloat { 0%, 100% { translate: 0 0; scale: 1; } 33% { translate: 30px -24px; scale: 1.08; } 66% { translate: -20px 18px; scale: .95; } }

/* Section heads */
.sec-head { text-align: center; max-width: 820px; margin: 0 auto 56px; }
.eyebrow { font-size: 19px; font-weight: 600; margin-bottom: 10px; letter-spacing: -.01em; }
.sec-title {
  font-size: clamp(40px, 5.6vw, 72px);
  font-weight: 700;
  letter-spacing: -.035em;
  line-height: 1.04;
  margin-bottom: 18px;
}
.sec-sub { font-size: clamp(17px, 1.6vw, 21px); color: var(--fg2); line-height: 1.42; max-width: 680px; margin: 0 auto; }
.eyebrow-sm { font-family: var(--gfont); font-size: 13px; font-weight: 500; color: var(--fg2); letter-spacing: .1px; }

/* ─── Cards: rounded, lit by the cursor ─────────────────────────────── */
.card {
  position: relative;
  isolation: isolate;
  border-radius: var(--r-card);
  background: var(--card);
  padding: 32px;
  box-shadow: 0 2px 6px var(--shadow), 0 16px 40px -12px var(--shadow);
  transition: transform .6s var(--ease), box-shadow .6s var(--ease), background-color .8s var(--ease);
}
.card::before {  /* cursor-lit border */
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), var(--glow), transparent 70%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
  z-index: 2;
}
.card::after {  /* soft interior light */
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--glow) 14%, transparent), transparent 60%);
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
  z-index: -1;
}
.card:hover::before, .card:hover::after { opacity: 1; }
.card:hover { transform: translateY(-6px); box-shadow: 0 4px 10px var(--shadow), 0 30px 60px -18px var(--shadow); }
.card.tilt:hover { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-6px); transition: transform .15s linear, box-shadow .6s var(--ease); }
.card-title { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 10px; }
.card-text { color: var(--fg2); font-size: 16px; line-height: 1.5; }
.card-text b { color: var(--fg); }

.icon-bubble {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--tb);
  color: var(--tc);
  transition: transform .5s var(--spring);
}
.icon-bubble .ic { width: 26px; height: 26px; }
.icon-bubble.sm { width: 40px; height: 40px; border-radius: 12px; }
.icon-bubble.sm .ic { width: 20px; height: 20px; }
.card:hover .icon-bubble { transform: scale(1.1) rotate(-6deg); }

/* ─── Reveal on scroll ──────────────────────────────────────────────── */
[data-reveal] {
  opacity: 0;
  transform: translateY(48px) scale(.97);
  filter: blur(10px);
  transition: opacity 1s var(--ease) var(--d, 0ms), transform 1s var(--ease) var(--d, 0ms), filter 1s var(--ease) var(--d, 0ms);
}
[data-reveal].in { opacity: 1; transform: none; filter: blur(0); }

/* ─── How it works ──────────────────────────────────────────────────── */
.scrub {
  max-width: 900px;
  margin: -16px auto 64px;
  text-align: center;
  font-size: clamp(26px, 3.2vw, 40px);
  font-weight: 600;
  letter-spacing: -.025em;
  line-height: 1.22;
}
.scrub span { color: var(--fg3); opacity: .45; transition: color .5s var(--ease), opacity .5s var(--ease); }
.scrub span.lit { color: var(--fg); opacity: 1; }
.how-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.how-card { display: flex; flex-direction: column; gap: 6px; min-height: 360px; }
.how-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; }
.how-n { font-size: 56px; font-weight: 700; letter-spacing: -.04em; line-height: 1; color: var(--hair); transition: color .5s; }
.how-card:hover .how-n { color: var(--fg3); }
.how-fact { margin-top: auto; padding-top: 20px; font-family: var(--gfont); font-size: 14px; font-weight: 500; }

/* ─── Result ────────────────────────────────────────────────────────── */
.result-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.result-main {
  grid-column: 1 / -1;
  padding: 48px clamp(24px, 5vw, 64px) 44px;
  text-align: center;
  overflow: hidden;
}
.result-main:hover { transform: translateY(-4px); }
.rm-top { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
.rm-title { font-size: clamp(22px, 2.4vw, 30px); font-weight: 600; letter-spacing: -.02em; line-height: 1.2; max-width: 760px; margin: 0 auto; }
.rm-q { font-size: 17px; color: var(--fg2); margin-top: 10px; }

.compare {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 140px minmax(0, 1fr);
  align-items: stretch;
  max-width: 900px;
  margin: 40px auto 32px;
}
.cmp {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 28px;
  padding: 28px 24px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  --c: var(--t-red);
  background: var(--b-red);
}
.cmp-good { --c: var(--t-green); background: var(--b-green); }
.cmp::before {  /* soft glow behind the number */
  content: '';
  position: absolute;
  z-index: -1;
  left: 50%;
  top: 38%;
  width: 260px;
  height: 260px;
  margin: -130px 0 0 -130px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%);
  animation: breathe 4s ease-in-out infinite;
}
.cmp-good::before { animation-delay: -2s; }
@keyframes breathe { 0%, 100% { scale: .9; opacity: .7; } 50% { scale: 1.1; opacity: 1; } }
.cmp-label { display: inline-flex; align-items: center; gap: 6px; font-family: var(--gfont); font-size: 14px; font-weight: 500; color: var(--c); }
.cmp-label .ic { width: 18px; height: 18px; }
.compare-num {
  font-size: clamp(96px, 12vw, 160px);
  font-weight: 700;
  letter-spacing: -.06em;
  line-height: 1;
  margin: 8px 0 2px;
  color: var(--c);
  font-variant-numeric: tabular-nums;
}
.cmp-unit { font-size: 15px; color: var(--fg2); margin-bottom: 20px; }

.dbrows { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 8px; min-height: 84px; justify-content: flex-start; }
.dbrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-radius: 12px;
  background: var(--card);
  box-shadow: 0 4px 14px -8px var(--shadow);
  font-size: 13px;
}
.dbrow .mono { font-size: 12px; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbrow b { font-family: var(--gfont); font-weight: 500; font-size: 12px; color: var(--t-green); }
.dbrow.dup { box-shadow: inset 0 0 0 1.5px var(--t-red); }
.dbrow.dup b { color: var(--t-red); }
.in .dbrow { animation: rowIn .6s var(--spring) both; animation-delay: calc(var(--i) * 260ms + 500ms); }
.in .dbrow.dup { animation: rowIn .6s var(--spring) both, shake .4s ease 2; animation-delay: calc(var(--i) * 260ms + 500ms), calc(var(--i) * 260ms + 1100ms); }

.cmp-mid { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.cmp-line {
  position: absolute;
  top: 50%;
  left: 8px;
  right: 8px;
  height: 2px;
  margin-top: -18px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--t-red), var(--t-green));
  opacity: .5;
}
.compare-arrow {
  position: relative;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card2);
  color: var(--fg);
  box-shadow: 0 10px 30px -10px var(--shadow), 0 0 0 6px var(--card);
  animation: nudge 2.4s ease-in-out infinite;
}
.compare-arrow .ic { width: 28px; height: 28px; }
@keyframes nudge { 0%, 100% { translate: 0 0; } 50% { translate: 6px 0; } }
.cmp-fix { display: inline-flex; align-items: center; gap: 6px; font-family: var(--gfont); font-size: 12px; font-weight: 500; color: var(--fg2); }
.cmp-fix .ic { width: 14px; height: 14px; }
.rm-foot { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.soft-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 14px 0 10px;
  border-radius: 8px;
  background: var(--card2);
  font-family: var(--gfont);
  font-size: 13px;
  font-weight: 500;
  color: var(--fg2);
}
.soft-chip .ic { width: 16px; height: 16px; color: var(--t-green); }
.tile { display: flex; flex-direction: column; gap: 10px; }
.tile-label { font-size: 15px; font-weight: 600; color: var(--fg2); }
.tile-num { font-size: 48px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
.tile-num span { font-size: 17px; font-weight: 500; letter-spacing: -.01em; color: var(--fg3); }

.testbar-cells { display: flex; gap: 4px; margin-bottom: 8px; }
.testbar-cells i {
  flex: 1;
  max-width: 30px;
  height: 10px;
  border-radius: 999px;
  display: block;
}
.in .testbar-cells i { animation: cellIn .6s var(--spring) both; animation-delay: calc(var(--i) * 70ms + 300ms); }
.tb-pass { background: #34A853; }
.tb-fail { background: #EA4335; }
@keyframes cellIn { from { transform: scaleX(0); opacity: 0; } }
.testbar-label { font-family: var(--gfont); font-size: 13px; font-weight: 500; color: var(--fg3); }
.chain-dots { display: flex; gap: 5px; flex-wrap: wrap; }
.chain-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); display: block; transition: transform .3s var(--spring); }
.chain-dot:hover { transform: scale(1.5); }

/* ─── Replay ────────────────────────────────────────────────────────── */
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.flow-node { padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 6px; }
.flow-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.flow-n { font-size: 13px; font-weight: 600; color: var(--fg3); }
.flow-label { font-family: var(--gfont); font-size: 12px; font-weight: 500; }
.flow-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.flow-detail { font-size: 13px; color: var(--fg2); line-height: 1.4; margin-bottom: 6px; flex: 1; }
.flow.playing .flow-node { transition: opacity .6s var(--ease), transform .6s var(--ease), box-shadow .6s var(--ease); }
.flow.playing .flow-node:not(.lit) { opacity: .3; transform: scale(.97); }
.flow.playing .flow-node.now { box-shadow: 0 0 0 2px var(--t-blue), 0 20px 50px -10px color-mix(in srgb, var(--t-blue) 50%, transparent); transform: translateY(-6px); }

.console { padding: 0; overflow: hidden; }
.console:hover { transform: none; }
.console-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px; flex-wrap: wrap; }
.console-title { font-weight: 600; font-size: 16px; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.console-title .mono { font-size: 12px; font-weight: 400; }
.console-ctrl { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.console-ctrl .gbtn { height: 36px; }

.stepper { position: relative; display: flex; justify-content: space-between; padding: 8px 32px 20px; }
.stepper-rail { position: absolute; left: 48px; right: 48px; top: 25px; height: 2px; background: var(--hair); border-radius: 2px; }
.stepper-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #4285F4, #A142F4, #34A853);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform .25s linear;
}
.stp {
  position: relative;
  overflow: hidden;
  z-index: 1;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--card2);
  box-shadow: inset 0 0 0 1.5px var(--hair);
  color: var(--fg3);
  font-family: var(--gfont);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color .35s, color .35s, box-shadow .35s, transform .35s var(--spring);
}
.stp:hover { transform: scale(1.12); color: var(--fg); }
.stp.done { background: var(--btn); color: var(--on-btn); box-shadow: none; }
.stp.now { box-shadow: 0 0 0 4px color-mix(in srgb, var(--btn) 35%, transparent); color: var(--fg); transform: scale(1.12); }
.stp:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

.console-body {
  height: 340px;
  overflow-y: auto;
  padding: 4px 28px 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--hair) transparent;
  mask-image: linear-gradient(to bottom, transparent 0, #000 24px);
}
.cl { padding: 14px 0; border-bottom: 1px solid var(--hair); animation: clIn .5s var(--ease) both; }
@keyframes clIn { from { opacity: 0; transform: translateY(12px); } }
.cl-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; font-size: 15px; }
.cl-step { font-family: var(--gfont); font-weight: 500; font-size: 13px; color: var(--fg3); min-width: 22px; }
.cl-text { color: var(--fg2); font-size: 15px; line-height: 1.55; padding-left: 32px; }
.cl-text.typing::after {
  content: '';
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 2px;
  vertical-align: -2px;
  background: var(--t-blue);
  animation: caret 1s steps(1) infinite;
}
@keyframes caret { 50% { opacity: 0; } }
.cl-end { display: flex; align-items: center; gap: 8px; padding-top: 16px; color: var(--t-green); font-size: 14px; font-weight: 500; }

/* ─── Pattern ───────────────────────────────────────────────────────── */
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 160px minmax(0, 1fr); align-items: center; gap: 12px; margin-bottom: 20px; }
.case .eyebrow-sm { margin-bottom: 8px; }
.case .card-title { margin-bottom: 20px; }
.fact { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--hair); font-size: 15px; }
.fact-k { color: var(--fg2); }
.fact-v { font-weight: 500; text-align: right; }

.echo-link { position: relative; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.echo-link::before {
  content: '';
  position: absolute;
  top: 50%;
  left: -12px;
  right: -12px;
  height: 2px;
  margin-top: -14px;
  background: linear-gradient(90deg, #4285F4, #A142F4);
  background-size: 200% 100%;
  animation: flowLine 2s linear infinite;
  border-radius: 2px;
  opacity: .6;
}
@keyframes flowLine { to { background-position: -200% 0; } }
.echo-core {
  position: relative;
  z-index: 1;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #4285F4, #A142F4);
  color: #fff;
  box-shadow: 0 10px 30px -6px rgba(161,66,244,.55);
}
.echo-core .ic { width: 28px; height: 28px; }
.echo-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 64px;
  height: 64px;
  margin: -46px 0 0 -32px;
  border-radius: 50%;
  border: 2px solid #A142F4;
  animation: echo 2.6s var(--ease) infinite;
}
.echo-ring:nth-child(2) { animation-delay: 1.3s; }
@keyframes echo { from { transform: scale(1); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
.echo-label { position: relative; z-index: 1; font-family: var(--gfont); font-size: 12px; font-weight: 500; color: var(--fg2); }

.pattern-card { text-align: center; padding: 48px clamp(24px, 6vw, 80px); margin-bottom: 56px; }
.pattern-card .eyebrow-sm { margin-bottom: 12px; }
.pattern-name {
  font-size: clamp(26px, 3.4vw, 44px);
  font-weight: 700;
  letter-spacing: -.03em;
  line-height: 1.12;
  margin-bottom: 16px;
  background: linear-gradient(90deg, #4285F4, #A142F4, #EA4335);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.pattern-card .card-text { max-width: 760px; margin: 0 auto 24px; }
.assist-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.assist-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 16px 0 8px;
  border-radius: 8px;
  box-shadow: inset 0 0 0 1px var(--outline);
  font-family: var(--gfont);
  font-size: 14px;
  font-weight: 500;
  color: var(--fg);
  cursor: help;
  transition: background-color .2s, transform .3s var(--spring);
}
.assist-chip .ic { width: 18px; height: 18px; color: var(--t-green); }
.assist-chip:hover { background: var(--dock-on); transform: translateY(-2px); }

.reach-head { text-align: center; margin-bottom: 24px; }
.reach-title { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
.reach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.reach-cell {
  border-radius: 20px;
  padding: 18px;
  background: transparent;
  box-shadow: inset 0 0 0 1.5px var(--hair);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 150px;
  transition: transform .4s var(--spring), background-color .3s;
}
.reach-cell:hover { transform: translateY(-4px); background: var(--card); }
.reach-domain { font-size: 15px; font-weight: 600; }
.reach-effect { font-size: 13px; color: var(--fg2); flex: 1; line-height: 1.4; }
.reach-state { display: flex; align-items: center; gap: 6px; font-family: var(--gfont); font-size: 12px; font-weight: 500; color: var(--fg3); }
.reach-state .ic { width: 16px; height: 16px; }
.reach-cell.hit { background: var(--card); box-shadow: inset 0 0 0 2px var(--t-blue), 0 12px 30px -12px var(--shadow); }
.reach-cell.hit .reach-state { color: var(--t-blue); }

/* ─── Finding ───────────────────────────────────────────────────────── */
.finding { padding: 40px; }
.finding:hover { transform: none; }
.finding-head { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 36px; }
.id-chip {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -.01em;
  padding: 10px 16px;
  border-radius: 16px;
  background: var(--b-purple);
  color: var(--t-purple);
}
.finding-info { flex: 1; min-width: 240px; }
.finding-info .card-title { margin-bottom: 4px; }

.life { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 16px; margin-bottom: 40px; }
.life-rail { position: absolute; top: 17px; left: 17px; right: calc(100% / var(--n) - 17px); height: 3px; border-radius: 3px; background: var(--hair); }
.life-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--t-yellow), var(--t-purple), var(--t-green));
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 1.6s var(--ease) .3s;
}
.finding:not([data-reveal]) .life-fill, .finding.in .life-fill { transform: scaleX(1); }
.life-step { position: relative; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.life-dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--tc);
  color: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 6px var(--card);
}
.finding.in .life-dot { animation: popIn .6s var(--spring) both; animation-delay: calc(var(--i) * 350ms + 400ms); }
.life-dot .ic { width: 20px; height: 20px; }
@keyframes popIn { from { transform: scale(0); } }
.life-meta { font-size: 13px; color: var(--fg3); }
.life-note { font-size: 14px; color: var(--fg2); line-height: 1.45; }

.codemap { padding: 28px; border-radius: 22px; background: var(--card2); margin-bottom: 16px; }
.codemap-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 36px; }
.codemap-track {
  position: relative;
  height: 44px;
  border-radius: 12px;
  background: repeating-linear-gradient(90deg, var(--hair) 0 2px, transparent 2px 7px);
}
.cm-region {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 10px;
  background: color-mix(in srgb, var(--tc) 28%, transparent);
  box-shadow: inset 0 0 0 2px var(--tc);
  min-width: 10px;
  transition: transform .35s var(--spring), box-shadow .3s;
  cursor: default;
}
.cm-region b {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--gfont);
  font-size: 12px;
  font-weight: 500;
  color: var(--tc);
  white-space: nowrap;
}
.cm-region.hl { transform: scaleY(1.2); box-shadow: inset 0 0 0 2px var(--tc), 0 0 24px color-mix(in srgb, var(--tc) 60%, transparent); }
.codemap-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg3); margin: 8px 0 24px; }
.cm-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cm-item { padding: 16px; border-radius: 16px; background: var(--card); transition: transform .35s var(--spring), box-shadow .3s; }
.cm-item.hl { transform: translateY(-4px); box-shadow: 0 12px 30px -12px var(--shadow), inset 0 0 0 1.5px var(--hair); }
.cm-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 15px; }
.cm-top .mono { margin-left: auto; font-size: 12px; }
.cm-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tc); }
.cm-issue { font-size: 14px; color: var(--fg2); line-height: 1.45; }

.expand-row { display: flex; justify-content: flex-start; margin-top: 8px; }
.expand-row.center { justify-content: center; margin-top: 40px; }
.expander { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s var(--ease); }
.expander.open { grid-template-rows: 1fr; }
.expander-inner { overflow: hidden; min-height: 0; }
.expander.open .expander-inner > * { animation: rise .6s var(--ease) both; }
#reasoning .expander-inner > .card-text { padding-top: 16px; margin-bottom: 20px; }
.mc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mc { padding: 18px; border-radius: 18px; background: var(--card2); display: flex; flex-direction: column; gap: 10px; }
.mc-id { font-family: var(--gfont); font-size: 12px; font-weight: 500; color: var(--t-purple); }
.mc-hist, .mc-cur { font-size: 14px; color: var(--fg2); line-height: 1.45; }
.mc-hist span, .mc-cur span { display: block; font-size: 12px; font-weight: 600; color: var(--fg); margin-bottom: 2px; }

/* ─── Tests ─────────────────────────────────────────────────────────── */
.test-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.test-card { display: flex; flex-direction: column; gap: 20px; }
.tc-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.tc-status { display: flex; align-items: center; gap: 10px; font-size: 32px; font-weight: 700; letter-spacing: -.03em; margin-top: 4px; }
.tc-status .ic { width: 30px; height: 30px; }
.tc-head .testbar { min-width: 160px; }
.tc-rows { display: flex; flex-direction: column; }
.tc-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair); font-size: 15px; color: var(--fg2); }
.tc-row b { font-weight: 600; }

.sim { padding: 20px; border-radius: 22px; background: var(--card2); }
.sim-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.sim-head .gbtn { height: 32px; margin-right: -8px; }
.sim-calls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.sim-call {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--card);
  opacity: .45;
  transform: translateX(-6px);
  transition: opacity .4s var(--ease), transform .5s var(--spring), box-shadow .4s;
}
.sim-call.active { opacity: 1; transform: none; box-shadow: 0 6px 20px -10px var(--shadow); }
.sim-call code { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sim-n { width: 24px; height: 24px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--fg2); transition: background .3s, color .3s; }
.sim-call.active .sim-n { background: var(--btn); color: var(--on-btn); }
.sim-res { display: inline-flex; align-items: center; gap: 6px; font-family: var(--gfont); font-size: 13px; font-weight: 500; white-space: nowrap; animation: rise .4s var(--ease) both; }
.sim-res:empty { animation: none; }
.sim-res .ic { width: 16px; height: 16px; }

.sim-table { position: relative; border-radius: 16px; background: var(--card); overflow: hidden; }
.sim-tr { display: grid; grid-template-columns: 52px minmax(0, 1fr) 96px; gap: 10px; padding: 10px 16px; font-size: 14px; border-top: 1px solid var(--hair); }
.sim-tr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sim-th { border-top: none; font-family: var(--gfont); font-size: 12px; font-weight: 500; color: var(--fg3); }
.sim-rows { min-height: 84px; }
.sim-tr.ok span:last-child { color: var(--t-green); font-weight: 600; }
.sim-tr.dup { background: var(--b-red); color: var(--t-red); }
.sim-tr.dup span:last-child { font-weight: 700; }
.sim-tr.enter { animation: rowIn .6s var(--spring) both; }
.sim-tr.dup.enter { animation: rowIn .6s var(--spring) both, shake .4s ease .6s 2; }
@keyframes rowIn { from { opacity: 0; transform: translateY(-12px) scale(.96); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.sim-table.shield::after {
  content: 'UNIQUE(refund_reference) blocked the duplicate';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 10px;
  font-family: var(--gfont);
  font-size: 12px;
  font-weight: 500;
  color: var(--t-blue);
  box-shadow: inset 0 0 0 2px var(--t-blue), inset 0 0 40px color-mix(in srgb, var(--t-blue) 30%, transparent);
  animation: shield 1.8s var(--ease) both;
  pointer-events: none;
}
@keyframes shield { 0% { opacity: 0; } 15%, 70% { opacity: 1; } 100% { opacity: 0; } }
.sim-foot { display: flex; gap: 24px; margin-top: 14px; font-size: 14px; color: var(--fg2); }
.sim-foot b { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin-left: 6px; color: var(--fg); vertical-align: -3px; }
.sim-foot b.t-red { color: var(--t-red); }
.sim-foot b.t-green { color: var(--t-green); }

.assert { padding: 16px 18px; border-radius: 18px; background: var(--b-red); }
.assert.ok { background: var(--b-green); }
.assert .eyebrow-sm { margin-bottom: 6px; }
.assert .mono { font-size: 13px; line-height: 1.55; color: var(--fg); }

/* ─── Proof ─────────────────────────────────────────────────────────── */
.proof-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.carousel-nav { display: flex; gap: 8px; }
.hs-meter { flex: 1; max-width: 280px; height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; margin-left: auto; }
.hs-meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4285F4, #A142F4, #34A853); transform-origin: left; transform: scaleX(0); }
.hs { position: relative; }
.hs.pinned .hs-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-x: clip;
}
.hs.pinned .hs-sticky > .wrap { width: 100%; }
.hs.pinned .track { overflow: visible; scroll-snap-type: none; will-change: transform; }
.hs.pinned .commit { transition: transform .6s var(--ease), box-shadow .6s var(--ease), background-color .8s var(--ease); }
.carousel { position: relative; z-index: 1; }
.track {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 12px max(24px, calc((100vw - 1180px) / 2 + 24px)) 36px;
  scroll-padding: 0 max(24px, calc((100vw - 1180px) / 2 + 24px));
  scrollbar-width: none;
}
.track::-webkit-scrollbar { display: none; }
.commit {
  flex: 0 0 300px;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 240px;
  padding: 26px;
  overflow: hidden;
}
.commit::after { background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%); }
.commit .commit-top::before {
  content: '';
  position: absolute;
  top: 0;
  left: 26px;
  right: 26px;
  height: 4px;
  border-radius: 0 0 4px 4px;
  background: var(--accent);
}
.commit-top { display: flex; justify-content: space-between; align-items: baseline; }
.commit-n { font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1; color: var(--hair); transition: color .4s; }
.commit:hover .commit-n { color: var(--accent); }
.commit-msg { font-family: var(--mono); font-size: 14px; line-height: 1.45; flex: 1; }
.commit-meta { font-size: 13px; color: var(--fg2); }
.commit.gone { display: none; }
.commit.pop { animation: rise .6s var(--ease) var(--d, 0ms) both; }

.chain-grid { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-top: 28px; }
.chain-card { padding: 24px; }
.chain-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.chain-n { font-size: 28px; font-weight: 700; letter-spacing: -.03em; color: var(--fg3); }
.chain-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 6px; }

/* ─── Limits ────────────────────────────────────────────────────────── */
.limit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.limit { padding: 24px; display: flex; flex-direction: column; gap: 10px; border-radius: 24px; }
.limit-title { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

/* ─── Footer ────────────────────────────────────────────────────────── */
.foot { position: relative; z-index: 1; text-align: center; padding: 40px 24px 64px; color: var(--fg3); font-size: 13px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.foot-logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
.foot-note { font-size: 12px; }

/* ─── Reduced motion ────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  :root { transition: none; }
  .hero-stage, .hero-inner, .hero-floats { transform: none !important; opacity: 1 !important; }
  .life-fill { transform: scaleX(1); }
  .scrub span { color: var(--fg); opacity: 1; }
}

/* ─── Responsive ────────────────────────────────────────────────────── */
@media (max-width: 1100px) {
  .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .how-grid { grid-template-columns: minmax(0, 1fr); }
  .how-card { min-height: 0; }
  .result-grid { grid-template-columns: minmax(0, 1fr); }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .echo-link { height: 110px; }
  .echo-link::before { display: none; }
  .cm-list { grid-template-columns: minmax(0, 1fr); }
  .test-pair { grid-template-columns: minmax(0, 1fr); }
  .fc-1, .fc-3 { display: none; }
}
@media (max-width: 720px) {
  body { font-size: 16px; }
  .dock { top: auto; bottom: 14px; gap: 0; padding: 5px; }
  .dock-item { height: 38px; padding: 0 8px; }
  .dock-item:hover, .dock-item:focus-visible { padding: 0 8px; }
  .dock-item:hover .dock-label, .dock-item:focus-visible .dock-label { max-width: 0; opacity: 0; margin: 0; }
  .dock-item .ic { width: 18px; height: 18px; }
  .hero-inner { padding-top: 72px; }
  .float-chip, .scroll-cue { display: none; }
  .sheet { border-radius: 32px 32px 0 0; }
  .card { padding: 24px; border-radius: 24px; }
  .result-main, .finding { padding: 24px; }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stepper { padding: 8px 12px 16px; }
  .stepper-rail { left: 24px; right: 24px; top: 21px; }
  .stp { width: 26px; height: 26px; font-size: 11px; }
  .console-body { padding: 4px 18px 22px; height: 380px; }
  .cl-text { padding-left: 0; }
  .life { grid-template-columns: minmax(0, 1fr); }
  .life-rail { display: none; }
  .mc-grid, .chain-grid { grid-template-columns: minmax(0, 1fr); }
  .sim-tr { grid-template-columns: 38px minmax(0, 1fr) 80px; }
  .compare { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .cmp-mid { flex-direction: row; }
  .cmp-line { display: none; }
  .compare-arrow { width: 48px; height: 48px; rotate: 90deg; }
  .commit { flex-basis: 260px; }
  .foot { padding-bottom: 96px; }
}

  </style>
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>EchoCode</div>
      <div class="boot-text">Loading investigation report…</div>
    </div>
  </div>
  <script>
/* EchoCode Dashboard — hero globe.
   A dot-matrix planet drawn on a 2D canvas: Fibonacci-distributed points,
   brighter on procedural "land", soft rim light and atmosphere. An arc links
   the historical case to the current finding, with a travelling pulse and
   sonar rings where it lands. Labels and positions come from dashboard.js
   via EchoGlobe.mount(); this file reads no report data. No dependencies. */

(function () {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const N = 5200;
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const TILT = 0.32;
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  const L = norm([-0.45, -0.6, 0.66]);

  /* Precompute sphere points (lat, lon, land flag) */
  const LAT = new Float32Array(N), LON = new Float32Array(N), LAND = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const y = 1 - ((i + 0.5) / N) * 2;
    const r = Math.sqrt(1 - y * y);
    const th = i * GOLDEN;
    const x = Math.cos(th) * r, z = Math.sin(th) * r;
    LAT[i] = Math.asin(y);
    LON[i] = Math.atan2(x, z);
    const lat = LAT[i], lon = LON[i];
    const land = Math.sin(lon * 3 + Math.sin(lat * 4) * 1.4) * Math.cos(lat * 2.6 + Math.sin(lon * 2) * 0.8)
               + 0.45 * Math.sin(lon * 7.3 - lat * 5.1);
    LAND[i] = land > 0.22 ? 1 : 0;
  }

  let canvas, ctx, host, W = 0, H = 0, dpr = 1, nodes = [];
  let raf = 0, running = false, paused = false;
  const ptr = { x: 0, y: 0, sx: 0, sy: 0 };

  function norm(v) { const m = Math.hypot(...v); return v.map(a => a / m); }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function toVec(lat, lon) { return [Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon)]; }
  function toLatLon(v) { const m = Math.hypot(v[0], v[1], v[2]); return { lat: Math.asin(v[1] / m), lon: Math.atan2(v[0], v[2]) }; }
  function slerp(a, b, t) {
    const d = Math.min(1, Math.max(-1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]));
    const om = Math.acos(d);
    if (om < 1e-4) return a;
    const s = Math.sin(om), ka = Math.sin((1 - t) * om) / s, kb = Math.sin(t * om) / s;
    return [a[0] * ka + b[0] * kb, a[1] * ka + b[1] * kb, a[2] * ka + b[2] * kb];
  }

  function geometry(t) {
    const R = Math.max(150, Math.min(W * 0.36, (H - (host.dataset.clear ? +host.dataset.clear : H * 0.5)) / 1.3, 560));
    return {
      R,
      cx: W / 2 + ptr.sx * 24,
      cy: H - R * 0.3 + ptr.sy * 10,
      rot: introSpin(t) + Math.sin((t - (t0 ?? t)) * 0.00012) * 0.18 + ptr.sx * 0.5,
    };
  }

  /* Spins in on load and settles facing front (rot 0 = case markers centred) */
  let t0 = null;
  function introSpin(t) {
    if (reduceMotion) return 0;
    if (t0 === null) t0 = t;
    const k = Math.min(1, (t - t0) / 2400);
    return -2.4 * Math.pow(1 - k, 3);
  }

  /* Rotate (lat, lon) by spin then tilt; return screen point + depth */
  function project(lat, lon, g, alt = 0) {
    const a = lon - g.rot, k = 1 + alt;
    const x = Math.cos(lat) * Math.sin(a) * k;
    const y = Math.sin(lat) * k;
    const z = Math.cos(lat) * Math.cos(a) * k;
    const y2 = y * ct + z * st;
    const z2 = -y * st + z * ct;
    return { x: g.cx + x * g.R, y: g.cy + y2 * g.R, z: z2, r2: x * x + y2 * y2 };
  }

  function resize() {
    const rect = host.getBoundingClientRect();
    W = rect.width; H = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    if (!running || reduceMotion) draw(0);
  }

  function draw(t) {
    ptr.sx += (ptr.x - ptr.sx) * 0.05;
    ptr.sy += (ptr.y - ptr.sy) * 0.05;
    const g = geometry(t);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    /* Atmosphere */
    const atm = ctx.createRadialGradient(g.cx, g.cy, g.R * 0.92, g.cx, g.cy, g.R * 1.55);
    atm.addColorStop(0, 'rgba(66,133,244,.30)');
    atm.addColorStop(0.35, 'rgba(161,66,244,.10)');
    atm.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = atm;
    ctx.fillRect(0, 0, W, H);

    /* Body */
    const body = ctx.createRadialGradient(g.cx - g.R * 0.35, g.cy - g.R * 0.55, g.R * 0.1, g.cx, g.cy, g.R);
    body.addColorStop(0, '#0d1b3a');
    body.addColorStop(0.7, '#05070f');
    body.addColorStop(1, '#000');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.R, 0, Math.PI * 2); ctx.fill();

    /* Dots, bucketed by brightness to keep draw calls low */
    const buckets = [new Path2D(), new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    for (let i = 0; i < N; i++) {
      const p = project(LAT[i], LON[i], g);
      if (p.z <= 0.02 || p.y > H + 2) continue;
      const nx = (p.x - g.cx) / g.R, ny = (p.y - g.cy) / g.R;
      const light = Math.max(0, nx * L[0] + ny * L[1] + p.z * L[2]);
      const v = LAND[i] ? 0.25 + light * 0.75 : 0.06 + light * 0.18;
      const b = Math.min(4, (v * 5) | 0);
      const s = LAND[i] ? 0.9 + p.z * 1.1 : 0.6 + p.z * 0.45;
      buckets[b].rect(p.x - s / 2, p.y - s / 2, s, s);
    }
    const alphas = [0.24, 0.42, 0.62, 0.82, 1];
    buckets.forEach((path, b) => {
      ctx.fillStyle = `rgba(${b > 2 ? '232,240,254' : '174,203,250'},${alphas[b]})`;
      ctx.fill(path);
    });

    /* Rim light */
    const rim = ctx.createLinearGradient(g.cx - g.R, g.cy - g.R, g.cx + g.R * 0.6, g.cy + g.R * 0.2);
    rim.addColorStop(0, 'rgba(255,255,255,.55)');
    rim.addColorStop(0.5, 'rgba(138,180,248,.25)');
    rim.addColorStop(1, 'rgba(138,180,248,0)');
    ctx.strokeStyle = rim;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, g.R, 0, Math.PI * 2); ctx.stroke();

    if (nodes.length >= 2) drawEcho(t, g);
  }

  function drawEcho(t, g) {
    const [A, B] = nodes;
    const va = toVec(A.lat, A.lon), vb = toVec(B.lat, B.lon);
    const M = 72, pts = [];
    for (let i = 0; i <= M; i++) {
      const s = i / M, ll = toLatLon(slerp(va, vb, s));
      pts.push(project(ll.lat, ll.lon, g, Math.sin(Math.PI * s) * 0.32));
    }
    const vis = p => p.z > 0 || p.r2 > 1;

    /* Arc with Google blue → green gradient */
    const pa = pts[0], pb = pts[M];
    const grad = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
    grad.addColorStop(0, A.color);
    grad.addColorStop(1, B.color);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.6;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    let pen = false;
    pts.forEach(p => {
      if (!vis(p)) { pen = false; return; }
      if (!pen) { ctx.moveTo(p.x, p.y); pen = true; } else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* Pulse */
    const cycle = 3600, s = (t % cycle) / cycle;
    if (s < 0.75) {
      const k = Math.floor((s / 0.75) * M);
      const p = pts[k];
      if (vis(p)) {
        ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = Math.max(0, k - 10); i <= k; i++) {
          const q = pts[i];
          if (i === Math.max(0, k - 10)) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
        }
        ctx.stroke();
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
        glow.addColorStop(0, 'rgba(255,255,255,.95)');
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI * 2); ctx.fill();
      }
    }

    /* Sonar rings at the echo target */
    for (let k = 0; k < 3; k++) {
      const age = ((t / 2400) + k / 3) % 1;
      ring(B, 0.015 + age * 0.3, g, (1 - age) * 0.7, B.color);
    }

    /* Markers + label chips */
    nodes.forEach((n, i) => {
      const p = project(n.lat, n.lon, g);
      if (p.z <= 0.05 || p.y > H - 8) return;
      const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 14);
      halo.addColorStop(0, n.color);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = n.color;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2); ctx.stroke();

      if (W < 640) return;
      const dir = i === 0 ? -1 : 1;
      ctx.font = '600 12px Inter, -apple-system, system-ui, sans-serif';
      const w1 = ctx.measureText(n.label).width;
      ctx.font = '500 11px Inter, -apple-system, system-ui, sans-serif';
      const w2 = ctx.measureText(n.sub).width;
      const bw = Math.max(w1, w2) + 28, bh = 44;
      const bx = dir < 0 ? p.x - 22 - bw : p.x + 22, by = p.y - bh - 14;
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x + dir * 7, p.y - 5);
      ctx.lineTo(dir < 0 ? bx + bw : bx, by + bh / 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(28,28,30,.72)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 14); else ctx.rect(bx, by, bw, bh);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.14)';
      ctx.stroke();
      ctx.fillStyle = n.color;
      ctx.beginPath(); ctx.arc(bx + 14, by + 16, 3, 0, Math.PI * 2); ctx.fill();
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.font = '600 12px Inter, -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#f5f5f7';
      ctx.fillText(n.label, bx + 22, by + 16);
      ctx.font = '500 11px Inter, -apple-system, system-ui, sans-serif';
      ctx.fillStyle = '#a1a1a6';
      ctx.fillText(n.sub, bx + 14, by + 32);
    });
  }

  function ring(n, ang, g, alpha, color) {
    if (alpha <= 0.01) return;
    const c = toVec(n.lat, n.lon);
    const up = Math.abs(c[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    const u = norm(cross(c, up)), v = cross(c, u);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    let pen = false;
    for (let i = 0; i <= 64; i++) {
      const th = (i / 64) * Math.PI * 2;
      const q = [0, 1, 2].map(j => c[j] * ca + (u[j] * Math.cos(th) + v[j] * Math.sin(th)) * sa);
      const ll = toLatLon(q), p = project(ll.lat, ll.lon, g);
      if (p.z <= 0) { pen = false; continue; }
      if (!pen) { ctx.moveTo(p.x, p.y); pen = true; } else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (!paused) draw(t);
  }

  window.EchoGlobe = {
    /** canvas: the <canvas>; opts.nodes: [{ lat, lon, label, sub, color }] (source first, echo target second) */
    mount(el, opts = {}) {
      canvas = el;
      host = el.parentElement;
      ctx = canvas.getContext('2d');
      nodes = opts.nodes || [];
      new ResizeObserver(resize).observe(host);
      resize();
      if (reduceMotion) return;
      host.addEventListener('pointermove', e => {
        const r = host.getBoundingClientRect();
        ptr.x = (e.clientX - r.left) / r.width - 0.5;
        ptr.y = (e.clientY - r.top) / r.height - 0.5;
      }, { passive: true });
      host.addEventListener('pointerleave', () => { ptr.x = ptr.y = 0; });
      running = true;
      raf = requestAnimationFrame(loop);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) cancelAnimationFrame(raf);
        else raf = requestAnimationFrame(loop);
      });
    },
    /** Stop drawing while the hero is fully covered */
    pause(v) { paused = !!v; },
  };
})();

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/** HTML-escape text taken from the report before injecting it */
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/** Extract a 7-char short SHA from various formats in report.json */
function shortSha(full) {
  if (!full || full === '—') return '—';
  const m = String(full).match(/([0-9a-f]{7,40})/i);
  return m ? m[1].slice(0, 7) : String(full).slice(0, 7);
}

/** Map a report status string to a colour tone */
function tone(s) {
  const u = String(s || '').toUpperCase();
  if (u.includes('REPAIRED') || u.includes('VERIFIED')) return 'green';
  if (u.includes('CONFIRMED')) return 'purple';
  if (u.includes('CANDIDATE')) return 'yellow';
  if (u.includes('INFERRED'))  return 'gray';
  if (u.includes('FAIL'))      return 'red';
  if (u.includes('PASS'))      return 'green';
  return 'blue';
}

function badge(text, t, dot) {
  return `<span class="badge tone-${t || tone(text)}">${dot ? '<i class="badge-dot"></i>' : ''}${esc(text)}</span>`;
}

/** Parse a pytest summary such as "1 failed, 5 passed" into counts */
function parseOutcome(text) {
  const s = String(text || '');
  const failed = +(s.match(/(\d+)\s+failed/) || [0, 0])[1];
  const passed = +(s.match(/(\d+)\s+passed/) || [0, 0])[1];
  return { failed, passed, total: failed + passed };
}

/** One pill per test, red for failures */
function testBar(outcome) {
  const o = parseOutcome(outcome);
  if (!o.total) return '';
  const cells = [
    ...Array.from({ length: o.passed }, () => 'tb-pass'),
    ...Array.from({ length: o.failed }, () => 'tb-fail'),
  ].map((c, i) => `<i class="${c}" style="--i:${i}"></i>`).join('');
  return `<div class="testbar" title="${esc(outcome)}">
    <div class="testbar-cells">${cells}</div>
    <div class="testbar-label"><span class="t-green">${o.passed} passed</span>${o.failed ? ` · <span class="t-red">${o.failed} failed</span>` : ''}</div>
  </div>`;
}

/* ── Result ────────────────────────────────────────────────────────── */

function buildResult({ r, finding, rv, cf, failE, passE, chain, overall }) {
  const before   = num(failE.actual_durable_records);
  const after    = num(passE.actual_durable_records);
  const expected = num(passE.expected_durable_records);
  const dots = chain.map(c => `<i class="chain-dot tone-${tone(c.status)}" title="Step ${c.step} · ${esc(c.status)}"></i>`).join('');
  const ref  = (String(failE.failing_assertion || '').match(/refund_reference='([^']+)'/) || [])[1] || 'refund_reference';
  /* one pill per recorded row; rows beyond the expected count are duplicates */
  const dbRows = n => Array.from({ length: n || 0 }, (_, i) => {
    const dup = expected !== null && i >= expected;
    return `<div class="dbrow${dup ? ' dup' : ''}" style="--i:${i}"><span class="mono">${esc(ref)}</span><b>${dup ? 'Duplicate' : 'Saved'}</b></div>`;
  }).join('');

  return `
  <section class="sec" id="result" data-theme="paper">
    <div class="wrap">

      <div class="result-grid" data-stagger>

            </div>

}

/* ── Pattern ───────────────────────────────────────────────────────── */

/* ── Finding ───────────────────────────────────────────────────────── */

/** Line-reference map of the finding's component, from structural_evidence */
function buildCodeMap(finding) {
  const se = finding.structural_evidence || {};
  const regions = [
    { key: 'schema_lines',             name: 'Schema',             issue: se.schema_issue,     t: 'red' },
    { key: 'function_signature_lines', name: 'Function signature', issue: se.idempotency_key,  t: 'yellow' },
    { key: 'write_path_lines',         name: 'Write path',         issue: se.write_path_issue, t: 'red' },
  ].map(x => {
    const m = String(se[x.key] || '').match(/(\d+)\s*-\s*(\d+)/);
    return m ? { ...x, from: +m[1], to: +m[2] } : null;
  }).filter(Boolean);
  if (!regions.length) return '';

  const max = Math.ceil((Math.max(...regions.map(x => x.to)) + 10) / 10) * 10;
  const pct = n => ((n - 1) / max * 100);

  return `
  <div class="codemap">
    <div class="codemap-head">
      <p class="eyebrow-sm">Where in the file</p>
      <p class="mono small muted">${esc(finding.component)}</p>
    </div>
    <div class="codemap-track">
      ${regions.map((x, i) => `<span class="cm-region tone-${x.t}" data-region="${i}" style="left:${pct(x.from).toFixed(2)}%;width:${(pct(x.to + 1) - pct(x.from)).toFixed(2)}%"><b>L${x.from}–${x.to}</b></span>`).join('')}
    </div>
    <div class="codemap-scale"><span>line 1</span><span>line ${max}</span></div>
    <div class="cm-list">
      ${regions.map((x, i) => `
      <div class="cm-item" data-region="${i}">
        <p class="cm-top"><span class="cm-dot tone-${x.t}"></span><b>${x.name}</b><span class="mono muted">L${x.from}–${x.to}</span></p>
        <p class="cm-issue">${esc(x.issue || '')}</p>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ── Tests ─────────────────────────────────────────────────────────── */

function buildTests({ rv, cf, failE, passE }) {
  const refMatch = String(failE.failing_assertion || '').match(/refund_reference='([^']+)'/);
  const ref = refMatch ? refMatch[1] : 'refund_reference';

  function card(kind, e, outcome, regression) {
    const o = parseOutcome(outcome);
    const regPass = /PASS/i.test(regression || '');
    const normal = o.passed - (regPass ? 1 : 0);
    const expected = num(e.expected_durable_records);
    const actual = num(e.actual_durable_records);
    const before = kind === 'before';
    const calls = Math.max(2, actual || 0);
    return `
    <article class="card test-card ${kind}">
      <div class="tc-head">
        <div>
          <p class="eyebrow-sm">${before ? 'Before repair' : `After repair · <span class="mono">${shortSha(rv.repair_commit)}</span>`}</p>
          <h3 class="tc-status t-${before ? 'red' : 'green'}">${icon(before ? 'error' : 'check_circle')}${before ? 'Test fails' : 'Test passes'}</h3>
        </div>
        ${testBar(outcome)}
      </div>
      <div class="tc-rows">
        <div class="tc-row"><span>Normal-operation tests</span><b class="t-green">${normal} / ${normal} pass</b></div>
        <div class="tc-row"><span>${before ? 'Duplicate-refund test' : 'Same duplicate-refund test'}</span><b class="t-${regPass ? 'green' : 'red'}">${esc(regression || '—')}</b></div>
      </div>

      <div class="sim" data-expected="${expected ?? ''}" data-actual="${actual ?? ''}" data-calls="${calls}">
        <div class="sim-head">
          <p class="eyebrow-sm">Replaying the test: same refund sent twice</p>
          ${gbtn('Replay', 'text', 'replay', 'data-sim-replay')}
        </div>
        <div class="sim-calls">
          ${Array.from({ length: calls }, (_, i) => `
          <div class="sim-call" data-call="${i}">
            <span class="sim-n">${i + 1}</span>
            <code>process_refund("${esc(ref)}")</code>
            <span class="sim-res"></span>
          </div>`).join('')}
        </div>
        <div class="sim-table">
          <div class="sim-tr sim-th"><span>Row</span><span>refund_reference</span><span>State</span></div>
          <div class="sim-rows"></div>
        </div>
        <div class="sim-foot">
          <span>Expected <b>${expected ?? '—'}</b></span>
          <span>Actual <b class="sim-count t-${actual !== null && expected !== null && actual > expected ? 'red' : 'green'}">0</b></span>
        </div>
      </div>

      ${before
        ? `<div class="assert"><p class="eyebrow-sm t-red">Failing assertion</p><p class="mono">${esc(failE.failing_assertion || '')}</p></div>`
        : `<div class="assert ok"><p class="eyebrow-sm t-green">Combined suite</p><p class="mono">${esc(passE.combined_suite_outcome || cf.after_repair_outcome || '')}</p></div>`}
    </article>`;
  }

  return `
  <section class="sec" id="tests" data-theme="light">
    ${orbs([['red', '-6%', '12%', 300, -0.1], ['green', '86%', '58%', 340, 0.1]])}
    <div class="wrap">
      ${head('Tests', 'Proven by a real test.', 'The same pytest test ran before and after the repair. Only the code changed, never the test.', 'green')}
      <div class="test-pair" data-stagger>
        ${card('before', failE, cf.before_repair_outcome, cf.before_repair_regression_result)}
        ${card('after', passE, cf.after_repair_outcome, cf.after_repair_regression_result)}
      </div>
    </div>
  </section>`;
}
